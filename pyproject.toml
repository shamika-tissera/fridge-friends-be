[project]
name = "fridge-friends-be"
version = "0.1.0"
description = "Track groceries, share a pantry with friends, and catch things before they expire."
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.140",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pydantic[email]>=2.8",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "alembic>=1.13",
    "openai>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.fastapi]
entrypoint = "app.main:app"
